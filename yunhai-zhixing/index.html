<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111b" />
  <meta name="description" content="云海织星 · The Astral Loom —— 一座悬于云海之上的织星所，以月为梭，以风为线。" />
  <title>云海织星 · The Astral Loom</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%238f3026'/%3E%3Crect x='5' y='5' width='54' height='54' fill='none' stroke='%23e7d4b6' stroke-opacity='.45'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='serif' font-size='36' fill='%23f2dfc8'%3E%E7%BB%87%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="云海织星三维体素场景"></canvas>
    <div class="wash" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="masthead">
      <div class="seal" aria-hidden="true"><span>织</span></div>
      <div class="brand">
        <p class="kicker">A CELESTIAL ATELIER</p>
        <h1>云海织星</h1>
        <div class="latin"><span></span>THE ASTRAL LOOM<span></span></div>
      </div>
    </header>

    <div class="chapter" aria-hidden="true">
      <span>卷</span><span>一</span><i></i><span>夜</span><span>织</span>
    </div>

    <aside class="poem">
      <p class="quote">以月为梭，以风为线。</p>
      <p>云海之上，织者将人间未竟的愿望捻成光，<br />一针，一针，织入夜空。</p>
      <span class="poem-index">壹 · 星线初引</span>
    </aside>

    <div class="readout" aria-hidden="true">
      <span>MOONRISE</span>
      <b>亥时三刻</b>
      <i></i>
      <span>WIND</span>
      <b>西北 · 三级</b>
    </div>

    <button id="weave" class="weave" type="button" aria-label="引一缕星线">
      <span class="weave-orbit" aria-hidden="true"></span>
      <span class="weave-core">
        <em>引</em>
        <small>缕星线</small>
      </span>
    </button>

    <nav class="views" aria-label="视角">
      <button type="button" data-view="wide" class="active"><i>01</i><span>云海</span></button>
      <button type="button" data-view="loom"><i>02</i><span>织机</span></button>
      <button type="button" data-view="hall"><i>03</i><span>灯阁</span></button>
      <button type="button" id="sound" class="icon-button" aria-label="开启声音" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path class="wave" d="M16 8.4a5 5 0 0 1 0 7.2M18.6 5.8a8.7 8.7 0 0 1 0 12.4"/></svg>
        <span class="sr-only">声音</span>
      </button>
    </nav>

    <p class="hint"><span>拖动环视</span><i></i><span>滚轮远近</span><i></i><span>按 E 引星</span></p>

    <div class="loading" id="loading">
      <div class="loading-inner">
        <div class="loading-seal"><span>织</span></div>
        <p class="loading-title">云海织星</p>
        <div class="loading-line"><b id="progress"></b></div>
        <p class="loading-copy" id="loading-copy">捻亮第一缕星线</p>
      </div>
    </div>

    <div class="no-webgl" id="no-webgl" hidden>
      <p>此作品需要 WebGL 支持。</p>
      <small>请使用最新版 Chrome、Safari 或 Edge 打开。</small>
    </div>
  </main>
  <script src="./bundle.js"></script>
</body>
</html>
