<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上元灯市 · 体素静帧</title>
<meta name="description" content="上元灯市：体素灯楼、虹桥与漕船的 CPU 光线投射静帧。">
<style>
  :root{
    --bg:#0a1018; --ink:#e9e2d2; --muted:#8f9aa6; --line:rgba(233,226,210,.16);
    --red:#c24935; --gold:#d9b36a;
    --serif:"Songti SC","STSong","Noto Serif SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SFMono-Regular","Menlo",monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{margin:0;min-height:100vh;background:
    radial-gradient(60% 45% at 50% 0%,rgba(43,63,92,.55),transparent 70%),
    radial-gradient(40% 30% at 80% 60%,rgba(194,73,53,.10),transparent 70%),
    var(--bg);}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;opacity:.12;mask-image:linear-gradient(180deg,#000,transparent 80%)}
  .wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:28px clamp(20px,5vw,56px) 80px}
  header{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
  .back{color:var(--ink);text-decoration:none;font:11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase}
  .back:hover{color:var(--gold)}
  .tag{font:10px/1 var(--mono);letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .hero{padding:clamp(52px,10vw,120px) 0 clamp(38px,6vw,72px);max-width:900px}
  .eyebrow{font:10px/1 var(--mono);letter-spacing:.26em;color:var(--gold);text-transform:uppercase;margin:0 0 22px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,9vw,110px);line-height:.95;letter-spacing:.06em;margin:0 0 24px}
  .lede{max-width:600px;color:var(--muted);font-size:clamp(14px,1.4vw,17px);line-height:1.9;margin:0}
  .meta{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:32px;font:11px/1.6 var(--mono);letter-spacing:.12em;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:400}
  .note{border-left:2px solid var(--red);padding:2px 0 2px 18px;margin:8px 0 48px;color:var(--muted);font-size:13px;line-height:1.9;max-width:640px}
  figure{margin:0 0 clamp(46px,7vw,92px)}
  .frame{position:relative;border:1px solid var(--line);background:#070c12;padding:clamp(8px,1.2vw,14px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .frame::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(233,226,210,.05)}
  img{display:block;width:100%;height:auto;image-rendering:auto}
  figcaption{display:flex;justify-content:space-between;gap:18px;padding-top:14px;font:10px/1.6 var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  figcaption b{color:var(--ink);font-weight:400}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding-top:26px;font:11px/1.8 var(--mono);letter-spacing:.08em;color:var(--muted)}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  footer a:hover{color:var(--gold);border-color:var(--gold)}
  @media (max-width:640px){
    .wrap{padding-bottom:56px}
    .hero{padding-top:46px}
    h1{font-size:clamp(40px,13vw,64px)}
    figcaption{display:block}
    figcaption span{display:block;margin-top:4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="../">← 体素工坊 / Voxel Atelier</a>
    <span class="tag">Still frames · 2026.09</span>
  </header>

  <section class="hero">
    <p class="eyebrow">Shangyuan Lantern Market</p>
    <h1>上元灯市</h1>
    <p class="lede">灯楼、虹桥、画舫与摊棚沿着河岸排开。上元夜的一瞬被拆成体素，再由一束束光线重新点亮。</p>
    <div class="meta">
      <span><b>媒介</b> CPU 光线投射</span>
      <span><b>渲染</b> 光域烘焙 + 体积雾</span>
      <span><b>分辨率</b> 640 × 380</span>
      <span><b>状态</b> 静帧</span>
    </div>
  </section>

  <p class="note">此件不是实时 WebGL 页面，而是离线渲染器的静帧输出；画面没有交互。渲染源码与光域烘焙管线收录在同一目录，可直接下载阅读。</p>

  <figure>
    <div class="frame"><img src="out/t2_0.png" alt="上元灯市全景：夜色中的灯楼、虹桥与河岸摊棚" width="640" height="380"></div>
    <figcaption><b>图 01 · 灯市全景</b><span>Camera 01 · 640 × 380</span></figcaption>
  </figure>

  <figure>
    <div class="frame"><img src="out/t2_1.png" alt="上元灯市近景：河岸灯楼与画舫" width="640" height="380"></div>
    <figcaption><b>图 02 · 河岸灯楼</b><span>Camera 02 · 640 × 380</span></figcaption>
  </figure>

  <footer>
    <span>体素工坊 · 静帧藏品 · 2026.09</span>
    <span><a href="../">返回全部作品</a> &nbsp;·&nbsp; <a href="https://github.com/ThySummer14/voxel-atelier" target="_blank" rel="noopener">GitHub ↗</a></span>
  </footer>
</div>
</body>
</html>
