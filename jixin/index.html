<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>机心 · 体素陀飞轮</title>
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <div id="stage"></div>
  <div class="veil glow"></div>
  <div class="veil vignette"></div>
  <div class="veil grain"></div>

  <header id="hud">
    <div class="brand">
      <h1>机<span class="gap">心</span></h1>
      <p class="sub">体素陀飞轮 · 一枚在读真实时间的表</p>
      <p class="en">VOXEL&nbsp;TOURBILLON — 18&#39;000&nbsp;A/h · 60s cage · 42h reserve</p>
    </div>
    <div class="meta">
      <div class="row"><b id="v-time">--:--:--</b><i>走时</i></div>
      <div class="row small"><span id="v-amp">0°</span><i>摆幅</i></div>
      <div class="row small"><span id="v-power">0%</span><i>动力储存</i></div>
      <div class="row small"><span id="v-beats">0</span><i>累计摆振</i></div>
      <div class="bar"><i id="bar-fill"></i></div>
      <div class="state"><em id="pulse"></em><span id="v-chip">走时中</span></div>
    </div>
  </header>

  <div id="labels"></div>

  <footer id="hint">
    <span><kbd>拖动表冠</kbd>上链</span>
    <span><kbd>1</kbd>/<kbd>0</kbd> 拔表冠停秒 · <kbd>←</kbd><kbd>→</kbd>拨针</span>
    <span><kbd>空格</kbd>夜光</span>
    <span><kbd>X</kbd>拆解</span>
    <span><kbd>G</kbd>放大镜</span>
    <span><kbd>M</kbd>听声</span>
    <span><kbd>D</kbd>演示放条</span>
    <span><kbd>C</kbd>表镜</span>
    <span><kbd>H</kbd>隐去文字</span>
    <span><kbd>滚轮</kbd>缩放 · <kbd>拖动</kbd>环绕</span>
  </footer>

  <div id="boot"><div class="ring"></div><p id="boot-msg">雕刻体素…</p></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
