    <script>
      (function () {
        const ring = document.getElementById("cursor-ring");
        let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y;
        addEventListener("pointermove", (e) => {
          tx = e.clientX;
          ty = e.clientY;
        });
        (function loop() {
          x += (tx - x) * 0.22;
          y += (ty - y) * 0.22;
          ring.style.left = x + "px";
          ring.style.top = y + "px";
          requestAnimationFrame(loop);
        })();
      })();
